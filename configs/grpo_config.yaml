# GRPO (Group Relative Policy Optimization) 训练配置
# 用于在 SFT 基础上进行强化学习优化
# v3：FP16 全量训练，group_size=8

# 模型配置（加载 SFT 训练后的 LoRA adapter）
model:
  model_name_or_path: "/data/workspace/skyoneliu/Program/sft_grpo/outputs/sft/best_model"
  trust_remote_code: true
  use_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05

# 数据配置
data:
  dataset_path: "/data/workspace/skyoneliu/Program/sft_grpo/data/grpo_data.json"
  max_prompt_length: 128
  max_new_tokens: 96         # 96 tokens：够模型自然结束，且不太慢

# GRPO 算法配置
grpo:
  num_generations: 4         # group_size=4：每个 prompt 生成 4 个回答，速度与质量的平衡
  temperature: 1.0

# 训练配置（全量真实训练）
training:
  output_dir: "/data/workspace/skyoneliu/Program/sft_grpo/outputs/grpo"
  num_train_epochs: 3        # 3 个完整 epoch
  per_device_train_batch_size: 4   # 必须是 num_generations 的整数倍；=4 意味着每步 1 个 prompt × 4 completions
  gradient_accumulation_steps: 4   # 等效 4 个 prompt/step，稳定梯度
  learning_rate: 0.00002     # 2e-5，温和以避免策略发散
  warmup_ratio: 0.1
  save_steps: 100
  save_total_limit: 3
  logging_steps: 5
  save_strategy: "steps"

# 奖励配置
reward:
  reward_type: "rule"

# 硬件配置
hardware:
  fp16: true                 # 启用 FP16 混合精度（T4 支持，节省显存约 40%）
  gradient_checkpointing: true
  dataloader_num_workers: 0

# 其他配置
misc:
  seed: 42
  report_to: "tensorboard"
  run_name: "qwen2.5-3b-grpo-v3-fp16"
