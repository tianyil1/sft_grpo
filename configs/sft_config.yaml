# SFT (Supervised Fine-Tuning) 训练配置
# 用于监督微调 Qwen2.5-3B-Instruct 模型

# 模型配置
model:
  model_name_or_path: "/data/workspace/skyoneliu/Program/sft_grpo/models/Qwen2.5-3B-Instruct"
  trust_remote_code: true
  use_lora: true  # 是否使用 LoRA 进行参数高效微调
  lora_r: 16  # LoRA 秩
  lora_alpha: 32  # LoRA alpha 参数
  lora_dropout: 0.05  # LoRA dropout

# 数据配置
data:
  dataset_path: "/data/workspace/skyoneliu/Program/sft_grpo/data/sft_data.json"
  validation_split_percentage: 10  # 验证集比例
  max_seq_length: 512  # 最大序列长度

# 训练配置
training:
  output_dir: "/data/workspace/skyoneliu/Program/sft_grpo/outputs/sft"
  num_train_epochs: 3  # 训练轮数
  per_device_train_batch_size: 2  # 每个设备的训练批次大小（根据 GPU 显存调整）
  per_device_eval_batch_size: 2  # 每个设备的评估批次大小
  gradient_accumulation_steps: 8  # 梯度累积步数（用于模拟更大的批次大小）
  learning_rate: 0.0002  # 学习率
  warmup_ratio: 0.03  # 预热比例
  lr_scheduler_type: "cosine"  # 学习率调度器类型
  save_steps: 500  # 保存检查点的步数
  save_total_limit: 3  # 最多保存的检查点数量
  logging_steps: 10  # 日志记录步数
  eval_steps: 500  # 评估步数
  eval_strategy: "steps"  # 评估策略
  save_strategy: "steps"  # 保存策略
  load_best_model_at_end: true  # 在训练结束时加载最佳模型
  metric_for_best_model: "loss"  # 最佳模型的评估指标
  greater_is_better: false  # loss 越小越好

# 硬件和性能配置
hardware:
  fp16: true  # 使用混合精度训练（Tesla T4 支持）
  gradient_checkpointing: true  # 梯度检查点，节省显存
  dataloader_num_workers: 4  # 数据加载器的工作线程数
  remove_unused_columns: false  # 是否移除未使用的列

# 其他配置
misc:
  seed: 42  # 随机种子
  report_to: "tensorboard"  # 报告工具（可选：wandb, tensorboard, all）
  run_name: "qwen2.5-3b-sft"  # 运行名称
